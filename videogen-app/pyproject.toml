[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
media = ["Pillow>=10.3", "opencv-python-headless>=4.9", "numpy>=1.26"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.setuptools.dynamic]
version = {attr = "videogen.__version__"}

[tool.setuptools.packages.find]
include = ["videogen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-ra"
markers = [
    "slow: long-running tests",
    "stress: stress tests (run explicitly)",
]
